<style id="shell">
/* ═══════════════════════════════════════════════════════════════
   KIT CTEN — V2 « Classeur »
   Shell : mise en page, intercalaires, lecteur, impression.
   Le rendu interne des fiches (A4) est régi par #a4-css et reste
   strictement identique à l'original (fidélité écran + impression).
   ═══════════════════════════════════════════════════════════════ */

:root{
  /* — Variables héritées, référencées par les styles internes des fiches — */
  --sbg:#fdf0f6;--sdeep:#b54070;--smid:#d4789a;--slight:#f2c0d4;
  --spale:#fce8f2;--petal:#fad5e8;--white:#fffcfe;
  --tdark:#2c1a28;--tdeep:#2c1a28;--tmid:#6b3a55;--tlight:#875668;--light:#875668;
  --leaf:#5e9470;--leafl:#d4ead9;--gold:#c9885a;--goldl:#f4e4d8;
  --r:14px;--rs:8px;
  /* alias défensifs (coquilles présentes dans quelques fiches) */
  --tmed:#6b3a55;--mid:#6b3a55;--color-border-tertiary:#f2c0d4;

  /* — Identité du classeur — */
  --brand:#b54070;--brand-deep:#7a1f45;--brand-mid:#c96a8a;
  --ink:#23201d;--ink-soft:#6d6459;--ink-faint:#9a9186;
  --desk:#e8e4db;            /* surface « bureau » */
  --desk-2:#e0dbd0;
  --cover:#f7f4ee;           /* couverture papier */
  --line:#d8d2c6;
  --shadow:28px 40px 80px -40px rgba(60,40,20,.5);

  /* — Couleurs des intercalaires (une teinte par partie) — */
  --c0:#7141b8; --c0-t:#efe0f9;   /* Présentation — violet (onglet ancien kit) */
  --c1:#4a80c0; --c1-t:#dce8fb;   /* Cadre institutionnel — bleu (onglet ancien kit) */
  --c2:#3aaa5a; --c2-t:#d4f0e7;   /* Enseigner en MPC — vert (onglet ancien kit) */
  --c3:#b54070; --c3-t:#fce0eb;   /* Pédagogie & classe — bordeaux/framboise (onglet ancien kit) */
  --c4:#f0923c; --c4-t:#fbe6da;   /* Outils & ressources — orange (onglet ancien kit) */

  --tab-w:44px;               /* largeur des onglets fermés */
  --tab-w-open:60px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(120% 90% at 12% -10%, #fdf4f8 0%, transparent 55%),
    radial-gradient(120% 90% at 100% 110%, #fbe7f1 0%, transparent 50%),
    #fef6fa;
  height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px}

/* ── SVG sprite masqué ── */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic,.uicon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ═══ APP ═══ */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ── Barre supérieure (le dos du classeur) ── */
.tb{
  flex-shrink:0;display:flex;align-items:center;gap:16px;
  padding:0 18px;height:60px;
  background:linear-gradient(135deg,#7a1f45,#b54070 45%,#c96a8a);
  color:#fff;box-shadow:0 6px 22px -10px rgba(80,20,50,.6);
  position:relative;z-index:40;
}
.tb-brand{display:flex;align-items:center;gap:12px;min-width:0}
.tb-emblem{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 38% 32%,#9a3560,#6c1b3e 78%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 9px rgba(0,0,0,.32),inset 0 0 0 1px rgba(255,255,255,.22);
}
.tb-emblem svg{width:42px;height:42px}
.tb-titles{min-width:0}
.tb-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:800;line-height:1.05;letter-spacing:.1px;white-space:nowrap}
.tb-name,.tb-disc{display:inline}
.tb-disc::before{content:' — '}
.tb-sub{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.72;white-space:nowrap}
.tb-spacer{flex:1}
.tb-btn{
  display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;
  border-radius:10px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.22);color:#fff;
  font-size:12.5px;font-weight:800;letter-spacing:.02em;
  transition:background .15s,transform .12s;white-space:nowrap;
}
.tb-btn:hover{background:rgba(255,255,255,.26);transform:translateY(-1px)}
.tb-btn .uicon{width:17px;height:17px}
.tb-btn kbd{
  font-family:inherit;font-size:10px;font-weight:800;letter-spacing:.04em;
  background:rgba(255,255,255,.2);border-radius:5px;padding:2px 6px;margin-left:2px;
}
.tb-btn.icon-only{padding:0;width:38px;justify-content:center}
@media(max-width:760px){
  .tb-btn .lbl{display:none}
  .tb-btn{padding:0;width:38px;justify-content:center}
  .tb-search kbd{display:none}
}
@media(max-width:700px){
  .tb{gap:10px;padding:0 12px;height:auto;min-height:58px;padding-top:8px;padding-bottom:8px}
  .tb-brand{gap:9px}
  .tb-emblem,.tb-emblem svg{width:36px;height:36px}
  .tb-title{white-space:normal;font-size:14.5px;line-height:1.14}
  .tb-name{display:block}
  .tb-disc{display:block;font-family:'Nunito',system-ui,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.01em;opacity:.85;line-height:1.25;margin-top:1px}
  .tb-disc::before{content:none}
  .tb-sub{display:none}
  .rail-toggle{padding:0;width:38px;justify-content:center;gap:0}
  .rail-toggle .rt-label{display:none}
}

/* ── Scène : rail · lecteur · intercalaires ── */
.stage{
  flex:1;min-height:0;position:relative;display:flex;overflow:hidden;
}

/* Rail gauche : sommaire de la partie courante */
.rail{
  flex-shrink:0;width:290px;height:100%;overflow-y:auto;
  background:#fbecf3;border-right:1px solid #f2d3e0;
  padding:20px 16px 30px;scrollbar-width:thin;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.rail::-webkit-scrollbar{width:8px}
.rail::-webkit-scrollbar-thumb{background:#cfc8bb;border-radius:8px}
.rail-part{
  display:flex;align-items:center;gap:10px;margin-bottom:4px;
}
.rail-chip{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:12px;
  background:var(--sec,var(--c0));box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.rail-ptxt{min-width:0;display:flex;flex-direction:column}
.rail-plabel{display:block;font-family:'Playfair Display',serif;font-size:15px;font-weight:800;line-height:1.15;color:var(--ink)}
.rail-pmeta{display:block;margin-top:2px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.rail-sep{height:1px;background:var(--line);margin:14px 2px}

.rail-group{margin-top:16px}
.rail-gtitle{
  font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--sec,var(--ink-soft));margin:0 4px 7px;
  padding-left:9px;border-left:3px solid var(--sec,var(--line));
}
.rail-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:8px 10px;border-radius:9px;color:var(--ink);
  transition:background .13s;position:relative;
}
.rail-item:hover{background:#efeae0}
.rail-num{
  flex-shrink:0;font-size:10.5px;font-weight:800;min-width:30px;
  color:var(--sec,var(--ink-soft));font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.rail-name{font-size:13px;font-weight:600;line-height:1.3;color:var(--ink)}
.rail-item.on{background:color-mix(in srgb,var(--sec,var(--brand)) 12%,transparent)}
.rail-item.on::before{
  content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;
  background:var(--sec,var(--brand));
}
.rail-item.on .rail-name{font-weight:800}
.rail-item.done::after{
  content:'✓';margin-left:auto;flex-shrink:0;
  width:18px;height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;color:var(--c2);
  background:color-mix(in srgb,var(--c2) 16%,transparent);
}
.rail-name{flex:1 1 auto;min-width:0}

/* En-tête « accueil » du rail (mode cover) */
.rail-toc-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:800;margin:2px 4px 12px}

/* ── Feuille de route (colonne gauche = parcours du profil) ── */
.rail-rm-empty{padding:6px 4px}
.rail-rm-eyebrow{
  display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);
}
.rail-rm-hint{margin:8px 0 14px;font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
.rail-rm-choose{
  display:inline-flex;align-items:center;gap:7px;width:100%;justify-content:center;
  height:40px;border-radius:10px;background:linear-gradient(135deg,var(--brand-deep),var(--brand));
  color:#fff;font-size:13px;font-weight:800;box-shadow:0 10px 22px -12px rgba(122,31,69,.6);
  transition:transform .14s,filter .14s;
}
.rail-rm-choose:hover{transform:translateY(-2px);filter:brightness(1.06)}
.rail-rm-choose .uicon{width:15px;height:15px}
.rail-rm-opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.rail-rm-opt{
  display:flex;flex-direction:column;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;
  transition:transform .14s,box-shadow .14s,border-color .14s;
}
.rail-rm-opt:hover{transform:translateY(-1px);box-shadow:0 10px 22px -16px rgba(60,40,20,.5);border-color:var(--brand-mid)}
.rail-rm-opt-label{font-family:'Playfair Display',serif;font-weight:800;font-size:13px;color:var(--ink);line-height:1.25}
.rail-rm-opt-tag{font-size:11px;color:var(--ink-soft);margin-top:2px}

/* Signal visuel : « c'est ici qu'on choisit » (déclenché depuis l'accueil) */
@keyframes railHint{
  0%,100%{box-shadow:inset 0 0 0 0 rgba(181,64,112,0)}
  35%    {box-shadow:inset 0 0 0 3px rgba(181,64,112,.55)}
}
@keyframes optHint{
  0%,100%{transform:translateY(0);border-color:var(--line);box-shadow:0 0 0 0 rgba(181,64,112,0)}
  40%    {transform:translateY(-2px);border-color:var(--brand);box-shadow:0 10px 24px -14px rgba(122,31,69,.65)}
}
/* le bouton se tourne vers le bandeau et « fait signe » vers la gauche */
@keyframes ctaPoint{
  0%,100%{transform:translateX(0)}
  30%    {transform:translateX(-9px)}
  60%    {transform:translateX(-3px)}
}
.rail.hint{animation:railHint 1.25s ease-in-out 2}
.rail.hint .rail-rm-opt{animation:optHint 1.25s ease-in-out 2}
.rail.hint .rail-rm-opt:nth-child(2){animation-delay:.07s}
.rail.hint .rail-rm-opt:nth-child(3){animation-delay:.14s}
.rail.hint .rail-rm-opt:nth-child(4){animation-delay:.21s}
.rail.hint .rail-rm-eyebrow{animation:optHint 1.25s ease-in-out 2}
.cs-cta.pointing{animation:ctaPoint 1.1s ease-in-out 3}
.cs-cta.pointing .uicon{transform:rotate(180deg)}      /* la flèche pointe vers le bandeau */
.cs-cta.pointing::after{
  content:'Faites votre choix dans le panneau de gauche';
  position:absolute;left:50%;top:calc(100% + 10px);transform:translateX(-50%);
  white-space:nowrap;font-size:11.5px;font-weight:800;letter-spacing:.02em;
  color:var(--brand-deep);background:#fff;border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line));
  border-radius:8px;padding:5px 10px;box-shadow:0 8px 20px -12px rgba(60,40,20,.5);
}
.cs-cta{position:relative}
@media(prefers-reduced-motion:reduce){
  .rail.hint,.rail.hint .rail-rm-opt,.rail.hint .rail-rm-eyebrow,.cs-cta.pointing{animation:none}
  .rail.hint{box-shadow:inset 0 0 0 3px rgba(181,64,112,.5)}
  .rail.hint .rail-rm-opt{border-color:var(--brand)}
}
@media(max-width:640px){
  .cs-cta.pointing::after{content:'Faites votre choix dans le panneau';white-space:normal;width:200px;text-align:center}
}

.rail-rm-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  margin:2px 2px 12px;padding-bottom:12px;border-bottom:1px solid var(--line);
}
.rail-rm-htxt{min-width:0;display:flex;flex-direction:column}
.rail-rm-name{
  display:block;margin-top:2px;font-family:'Playfair Display',serif;font-weight:800;
  font-size:15.5px;line-height:1.15;color:var(--ink);
}
.rail-rm-change{
  flex-shrink:0;font-size:11px;font-weight:800;color:var(--ink-faint);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;transition:border-color .14s,color .14s;
}
.rail-rm-change:hover{border-color:var(--brand-mid);color:var(--brand-deep)}
.rail-rm-prog{margin:0 2px 14px;display:flex;flex-direction:column;gap:6px}
.rail-rm-progbar{height:5px;border-radius:3px;overflow:hidden;background:color-mix(in srgb,var(--brand) 13%,transparent)}
.rail-rm-progbar>span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--brand),var(--brand-deep));transition:width .35s cubic-bezier(.4,0,.2,1)}
.rail-rm-progtxt{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--ink-soft)}
.rail-rm-prog.done .rail-rm-progbar>span{background:linear-gradient(90deg,var(--c2),color-mix(in srgb,var(--c2) 70%,#000))}
.rail-rm-prog.done .rail-rm-progtxt{color:var(--c2)}
.rail-rm-prog.done .rail-rm-progtxt::before{content:'✓ ';font-weight:900}
.rail-rm-next{
  display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;
  margin:0 2px 12px;padding:11px 12px;border-radius:11px;
  background:linear-gradient(135deg, color-mix(in srgb,var(--brand) 9%,#fff), #fff);
  border:1px solid color-mix(in srgb,var(--brand) 26%,var(--line));
  transition:transform .14s,box-shadow .14s,border-color .14s;
}
.rail-rm-next:hover{transform:translateY(-1px);box-shadow:0 12px 24px -16px rgba(122,31,69,.5);border-color:var(--brand-mid)}
.rail-rm-next-eyebrow{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.rail-rm-next-row{display:flex;align-items:center;gap:8px}
.rail-rm-next-label{flex:1 1 auto;min-width:0;font-family:'Playfair Display',serif;font-weight:800;font-size:12.5px;line-height:1.2;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rail-rm-next-go{flex-shrink:0;width:15px;height:15px;color:var(--brand)}
.rail-rm-print{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  margin-top:14px;padding:9px 12px;border-radius:10px;
  border:1px solid var(--line);color:var(--ink-soft);font-size:12px;font-weight:700;
  transition:border-color .14s,color .14s,background .14s;
}
.rail-rm-print:hover{border-color:var(--brand-mid);color:var(--brand-deep);background:#fff}
.rail-rm-print .uicon{width:15px;height:15px}

.rail-rm-list{display:flex;flex-direction:column;gap:2px}
.rail-rm-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 10px 9px 12px;border-radius:10px;position:relative;transition:background .13s;
}
.rail-rm-item:hover{background:#efeae0}
.rail-rm-code{
  flex-shrink:0;align-self:flex-start;margin-top:1px;
  min-width:30px;text-align:center;padding:3px 6px;border-radius:7px;
  background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand-deep);
  font-size:10px;font-weight:800;letter-spacing:.04em;line-height:1.2;
  transition:background .13s,color .13s;
}
.rail-rm-t{
  flex:1 1 auto;min-width:0;
  font-size:12.5px;font-weight:600;line-height:1.3;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.rail-rm-check{
  flex-shrink:0;width:15px;height:15px;color:var(--c2);opacity:0;transition:opacity .13s;
  align-self:flex-start;margin-top:2px;
}
.rail-rm-item.done .rail-rm-check{opacity:1}
.rail-rm-item.done .rail-rm-t{color:var(--ink-soft)}
.rail-rm-item.on{background:color-mix(in srgb,var(--brand) 12%,transparent)}
.rail-rm-item.on::before{
  content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--brand);
}
.rail-rm-item.on .rail-rm-t{font-weight:800;color:var(--ink)}
.rail-rm-item.on .rail-rm-code{background:var(--brand);color:#fff}


/* ── Lecteur (le plateau où repose la fiche) ── */
.reader{
  flex:1;min-width:0;height:100%;position:relative;overflow:hidden;
  display:flex;align-items:flex-start;justify-content:center;
  padding:26px 20px;
}
.reader-scroll{
  width:100%;height:100%;overflow-y:auto;overflow-x:hidden;
  position:relative;z-index:2;
  animation:kcten-content-in .34s cubic-bezier(.4,0,.2,1) both;
  display:flex;flex-direction:column;align-items:center;
  scrollbar-width:thin;scrollbar-color:#c9c2b5 transparent;
  scroll-behavior:smooth;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.reader-scroll::-webkit-scrollbar{width:10px}
.reader-scroll::-webkit-scrollbar-thumb{background:#c9c2b5;border-radius:10px}

/* enveloppe de mise à l'échelle de la fiche A4 */
.paper{
  --z:1;zoom:var(--z);
  transition:opacity .26s ease, transform .26s ease;
}
.paper.turn-out{opacity:0;transform:translateX(-24px)}
.paper.turn-in{opacity:0;transform:translateX(24px)}
@media(prefers-reduced-motion:reduce){.paper{transition:opacity .12s}.paper.turn-out,.paper.turn-in{transform:none}}

/* le .a4-viewer d'origine est centré sans padding extérieur (on gère l'espace ici) */
.reader .a4-viewer{padding:0;gap:18px;}

/* ── Fiche en LECTURE CONTINUE (mobile uniquement) ──
   buildA4Flow ajoute la classe .a4-flow. La fiche garde EXACTEMENT sa mise en page
   (identique au bureau) ; on se contente de deux choses : la page grandit avec son
   contenu (défilement continu, plus de bas coupé), et l'ensemble est réduit pour
   tenir dans la largeur de l'écran (voir currentZoom). AUCUNE réorganisation du
   contenu. Le rendu bureau et l'impression ne sont pas affectés. */
.reader .a4-flow .a4-page{height:auto;min-height:0;overflow:visible}
.reader .a4-flow .a4-page>.a4-content{flex:0 0 auto;height:auto;overflow:visible}
@media(max-width:760px){
  /* En-tête interne masqué (redondant avec la barre de l'appli et le bloc-titre). */
  .reader .a4-flow .a4-header{display:none}
  /* Sécurité : si jamais une fiche dépassait, on peut la faire défiler
     horizontalement (mais normalement la fiche est réduite pour tenir pile dans
     l'écran, donc rien à faire glisser). Barre de défilement masquée. */
  .reader .reader-scroll{overflow-x:auto}
  .reader .reader-scroll{scrollbar-width:none}
  .reader .reader-scroll::-webkit-scrollbar{width:0;height:0;display:none}
  /* Flèches précédent/suivant en bas : elles ne recouvrent plus le texte. */
  .reader .flip{top:auto;bottom:84px;transform:none;width:38px;height:38px;opacity:.93}
  .reader .flip.prev{left:10px}
  .reader .flip.next{right:10px}
  .reader .flip:hover:not(:disabled){transform:none}
}

/* Reliure décorative à gauche du plateau */
.reader::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:22px;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,
    rgba(60,40,30,.11) 0%,
    rgba(60,40,30,.05) 35%,
    rgba(60,40,30,0) 100%);
}

/* Flèches de feuilletage */
.flip.onpath{border-color:color-mix(in srgb,var(--brand) 42%,var(--line));box-shadow:0 8px 22px -8px rgba(122,31,69,.45)}
.flip.onpath:not([disabled]){color:var(--brand)}
.flip{
  position:absolute;top:50%;transform:translateY(-50%);z-index:20;
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.94);color:var(--brand-deep);
  border:1px solid var(--line);box-shadow:0 8px 22px -8px rgba(60,40,20,.5);
  display:flex;align-items:center;justify-content:center;
  transition:transform .16s,background .16s,opacity .16s;
}
.flip:hover:not(:disabled){transform:translateY(-50%) scale(1.08);background:#fff}
.flip:disabled{opacity:.28;cursor:default}
.flip.prev{left:16px}.flip.next{right:16px}
.flip .uicon{width:24px;height:24px;stroke-width:2.4}
@media(max-width:900px){.flip{width:42px;height:42px}.flip.prev{left:8px}.flip.next{right:8px}}

/* Barre d'outils de lecture (flottante en bas) */
.readbar{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:25;
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:14px;padding:6px;
  box-shadow:0 12px 30px -12px rgba(60,40,20,.5);
}
.readbar .rb-crumb{
  display:flex;align-items:center;gap:8px;padding:0 10px 0 8px;max-width:min(46vw,430px);
}
.readbar .rb-id{
  flex-shrink:0;font-size:11px;font-weight:800;color:#fff;
  background:var(--sec,var(--brand));border-radius:7px;padding:4px 9px;letter-spacing:.03em;
}
.readbar .rb-name{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readbar .rb-pages{font-size:10.5px;font-weight:800;letter-spacing:.05em;color:var(--ink-faint);text-transform:uppercase;white-space:nowrap}
.rb-sep{width:1px;height:26px;background:var(--line)}
.rb-btn{
  width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:var(--brand-deep);transition:background .13s;
}
.rb-btn:hover{background:var(--spale)}
.rb-btn .uicon{width:17px;height:17px}
/* ── Favoris : étoile discrète sur la fiche + filtre dans la recherche ── */
.rb-fav .uicon{transition:fill .15s ease,color .15s ease,transform .12s ease}
.rb-fav:hover .uicon{transform:scale(1.12)}
.rb-fav.on{color:#d4a017}
.rb-fav.on .uicon{fill:#f2c94c}
.pal-fav-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--tdeep);background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 11px 4px 9px;transition:all .13s}
.pal-fav-chip .uicon{width:14px;height:14px}
.pal-fav-chip:hover{border-color:var(--brand-mid)}
.pal-fav-chip.on{background:#f2c94c;border-color:#e0b23c;color:#3a2a00}
.pal-fav-chip.on .uicon{fill:currentColor}
.pal-fav-ind{width:13px;height:13px;fill:#f2c94c;color:#d4a017;flex-shrink:0;margin-left:6px}
.rb-zoom{font-size:11px;font-weight:800;color:var(--ink-soft);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
.rb-print{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;
  background:linear-gradient(135deg,var(--brand-deep),var(--brand));color:#fff;
  font-size:12px;font-weight:800;
}
.rb-print:hover{filter:brightness(1.07)}
.rb-copy{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;color:var(--brand-deep);font-size:12px;font-weight:800;transition:background .13s}
.rb-copy:hover{background:var(--spale)}
.rb-copy .uicon{width:15px;height:15px}
.rb-print .uicon{width:15px;height:15px}
@media(max-width:760px){
  .readbar .rb-name{display:none}
  .rb-print .lbl{display:none}.rb-print{padding:0;width:34px;justify-content:center}
  .rb-copy .lbl{display:none}.rb-copy{padding:0;width:34px;justify-content:center}
}

/* ── Intercalaires (le classement, à droite) ── */
.tabs{
  flex-shrink:0;width:var(--tab-w-open);height:100%;position:relative;z-index:30;
  display:flex;flex-direction:column;gap:8px;padding:16px 0;
  background:linear-gradient(90deg, rgba(0,0,0,.05), transparent 40%);
}
.tab{
  position:relative;flex:1;min-height:0;max-height:150px;
  width:var(--tab-w);margin-left:auto;
  border-radius:12px 0 0 12px;
  background:var(--sec);color:#fff;
  display:flex;align-items:center;justify-content:center;
  padding:14px 3px;
  box-shadow:-4px 4px 14px -6px rgba(60,40,20,.5), inset 1px 0 0 rgba(255,255,255,.25);
  transition:width .2s cubic-bezier(.4,0,.2,1), filter .15s, transform .15s;
  overflow:visible;
}
.tab::after{  /* liseré clair intérieur, effet plastique */
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(90deg, rgba(255,255,255,.18), transparent 30%);
  pointer-events:none;
}
.tab-label{
  writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);
  font-family:'Playfair Display',serif;font-weight:700;font-size:12.5px;
  letter-spacing:.01em;line-height:1.2;text-align:center;
  white-space:normal;overflow-wrap:break-word;hyphens:auto;
  max-height:100%;max-width:100%;overflow:hidden;
}
.tab-count{
  position:absolute;top:0;left:6px;transform:translateY(-52%);
  display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:50%;
  font-size:12px;font-weight:800;line-height:1;letter-spacing:0;color:var(--sec);
  background:#fff;z-index:2;

}
@keyframes kcten-count-in{from{opacity:0;transform:translateY(-52%) scale(.4)}to{opacity:1;transform:translateY(-52%) scale(1)}}
@media(prefers-reduced-motion:reduce){.tab-count{animation:none!important}}
.tab:hover{width:calc(var(--tab-w) + 8px);filter:brightness(1.06)}

/* ═══ COVER / SOMMAIRE (écran d'accueil) ═══ */

/* ── Accueil : avertissement + « Infos + » (crédits & remerciements) ──────
   Même principe que le générateur de prompts : un encadré d'avertissement
   toujours visible, qui se déplie sur les crédits. Aucun script requis
   (élément <details> natif). */
.kc-warn{
  margin-top:34px;border:1px solid var(--line);border-left:4px solid var(--brand-mid);
  border-radius:12px;background:linear-gradient(135deg,var(--cover),#fffdfa);
  overflow:hidden;
}

  display:flex;align-items:flex-start;gap:12px;

.kc-warn-ico{flex-shrink:0;width:17px;height:17px;margin-top:1px;color:var(--brand);stroke:currentColor;fill:none;stroke-width:2}

/* ═══ INTERCALAIRE (page de séparation d'une partie) ═══ */
.divider{

}

@keyframes kcten-num-in{from{opacity:0;transform:translateY(-50%) scale(1.22)}60%{opacity:1}to{opacity:1;transform:translateY(-50%) scale(1)}}
@media(prefers-reduced-motion:reduce){.reader-scroll,.dv-plate::after{animation:none!important}}
.dv-plate::after{
  content:attr(data-mark);position:absolute;right:30px;top:50%;transform:translateY(-50%);
  font-family:'Playfair Display',serif;font-weight:900;font-size:118px;line-height:1;

}

.dv-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:600px){.dv-list{grid-template-columns:1fr}}
.dv-fiche{
  display:flex;align-items:center;gap:12px;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  transition:transform .14s,box-shadow .14s,border-color .14s;position:relative;
}

}

.dv-fgo{margin-left:auto;color:var(--sec);flex-shrink:0}
.dv-fiche.done .dv-fnum::after{
  content:'✓';position:absolute;top:-6px;right:-6px;
  width:18px;height:18px;border-radius:50%;
  background:var(--c2);color:#fff;font-size:10px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.28);

/* ═══ Palette de recherche (⌘K) ═══ */
.pal-back{
  position:fixed;inset:0;z-index:200;background:rgba(35,25,20,.42);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;
}
.pal-back.open{display:flex;animation:palIn .16s ease}
@keyframes palIn{from{opacity:0}to{opacity:1}}
.pal{
  width:min(600px,100%);background:#fff;border-radius:16px;overflow:hidden;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.5);border:1px solid var(--line);
}
.pal-in{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line)}
.pal-in .uicon{color:var(--brand);flex-shrink:0}

#pal-input::placeholder{color:var(--ink-faint)}
.pal-esc{font-size:10px;font-weight:800;color:var(--ink-faint);border:1px solid var(--line);border-radius:5px;padding:3px 6px}

.pal-seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.pal-seg-btn{font-size:11.5px;font-weight:800;color:var(--ink-soft);padding:4px 11px;border-radius:7px;transition:all .13s}
.pal-seg-btn:hover{background:var(--spale)}
.pal-seg-btn.on{background:var(--brand-deep);color:#fff}
.pal-count{font-size:10.5px;font-weight:800;color:var(--ink-faint);margin-left:2px}
.pal-reset{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--brand-deep);text-decoration:underline;padding:2px 4px}
.pal-chips{display:flex;flex-wrap:wrap;gap:5px}
.pal-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--tdeep);background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 11px 4px 8px;transition:all .13s}
.pal-chip:hover{border-color:var(--brand-mid)}
.pal-chip.on{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}
.pal-chip-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--tcol,#ccc)}
.pal-chip.on .pal-chip-dot{box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.readbar{max-width:calc(100vw - 16px)}
.readbar .rb-crumb{min-width:0}
@media(max-width:600px){.pal-chips{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.pal-chips::-webkit-scrollbar{display:none}.pal-chip{flex-shrink:0}.pal-back{padding:6vh 12px 12px}}
.pal-list{max-height:52vh;overflow-y:auto;padding:6px}
.pal-empty{padding:26px;text-align:center;color:var(--ink-faint);font-size:13.5px}
.pal-item{

  padding:10px 12px;border-radius:10px;transition:background .1s;
}
.pal-item.sel,.pal-item:hover{background:var(--spale)}
.pal-pill{
  flex-shrink:0;margin-top:1px;font-size:10.5px;font-weight:800;color:#fff;background:var(--sec,var(--brand));
  border-radius:6px;padding:3px 8px;min-width:34px;text-align:center;letter-spacing:.02em;
}
.pal-txt{min-width:0;flex:1 1 auto}
.pal-name{font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-part{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint)}

/* ── Toast ── */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);
  background:#20301f;color:#fff;padding:12px 20px;border-radius:11px;font-weight:700;font-size:13.5px;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all .25s;z-index:300;
  display:flex;align-items:center;gap:9px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.win{background:linear-gradient(135deg,#15805f,#0f5f46)}
.toast .uicon{width:16px;height:16px;flex-shrink:0}

/* ── Bouton d'ouverture du rail (mobile) ── */
.rail-toggle{display:none}
.rail-veil{display:none}
/* Le voile ne doit JAMAIS rester affiché quand il porte l'attribut [hidden] :
   en mobile la règle .rail-veil{display:block} ci-dessous l'emportait sur [hidden],
   laissant un calque invisible (opacity:0) au-dessus de toute la scène qui captait
   le défilement, les flèches et les onglets. Cette règle (spécificité supérieure)
   rétablit display:none tant que le voile est masqué. */
.rail-veil[hidden]{display:none!important}
@media(max-width:900px){
  .rail{
    position:absolute;left:0;top:0;z-index:35;transform:translateX(-100%);
    box-shadow:14px 0 40px -18px rgba(60,40,20,.5);
  }
  .rail.open{transform:translateX(0)}

    border-radius:12px;color:var(--ink-soft);font-family:inherit;font-size:10.5px;font-weight:800;letter-spacing:.02em;
    background:none;border:none;transition:color .15s,background .15s;
  }
  .mnav-btn .uicon{width:21px;height:21px}
  .mnav-btn.on{color:var(--brand);background:var(--spale)}
  .mnav-btn:active{transform:scale(.96)}

  /* ── Place pour la barre : tout le plateau remonte ── */
  .stage{padding-bottom:calc(64px + env(safe-area-inset-bottom))}

  /* ── Chrome du haut épuré : la barre basse reprend ces accès ── */
  .tb-search,.tb-home,.rail-toggle{display:none}

  /* ── Intercalaires latéraux remplacés par l'écran « Fiches » ── */
  .tabs{display:none}

  /* ── Lecture d'une fiche : plein écran, commandes essentielles ── */
  .reader{padding:10px 10px 16px}
  .readbar .rb-zoom,.readbar [data-zoom],.readbar .rb-sep{display:none}
  .reader .readbar{bottom:10px;max-width:calc(100% - 16px)}
  .reader .flip{bottom:66px}

  /* ── Lecture « reflow » : texte pleine taille, plus de page A4 réduite ──
     En lecture continue (.a4-flow, mobile uniquement), on n'écrase plus la
     feuille A4 à ~40 % : la page prend la largeur de l'écran et le contenu
     se réorganise. Le facteur 1.15 agrandit la typographie d'origine (corps
     10pt ≈ 15px affichés) tout en laissant le texte se recomposer. Le rendu
     bureau et l'impression conservent la pagination A4 exacte. */
  .reader .paper.paper-flow{--z:1.15!important;padding:10px 6px 30px}
  .a4-viewer.a4-flow{--a4-pad-x:15px;--a4-content-pad-y:10px;width:100%;min-width:0}
  .reader .a4-flow .a4-page{width:100%;min-width:0}
  .reader .a4-flow .a4-content{overflow-wrap:break-word}
  /* Colonnes empilées : les grilles 2-5 colonnes deviennent une seule colonne. */
  .reader .a4-flow .a4-content .g2{grid-template-columns:1fr}
  .reader .a4-flow .a4-content [style*="grid-template-columns"]{grid-template-columns:1fr!important}
  /* Liseré de reliure atténué : le bandeau rose de 4mm (pensé pour l'A4
     imprimé) devient un fin filet discret sur petit écran. */
  .reader .a4-flow .a4-page::before{
    width:3px;
    background:linear-gradient(180deg,var(--a4-accent-mid),var(--a4-accent-soft));
    opacity:.75;
  }
  /* Décor A4 retiré sur petit écran : ombre de reliure du lecteur et
     estampille ∑ en filigrane (chevauchait le titre en lecture continue). */
  .reader::before{display:none}
  .reader .a4-flow .a4-page::after{display:none}

  /* ── Bouton « retour en haut de fiche » ── */
  .mob-top{
    position:fixed;right:12px;bottom:calc(190px + env(safe-area-inset-bottom));z-index:105;

    box-shadow:0 8px 22px -8px rgba(60,40,20,.5);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transform:translateY(6px);
    transition:opacity .2s,transform .2s;
  }
  .mob-top.show{opacity:1;pointer-events:auto;transform:none}
  .mob-top .uicon{width:18px;height:18px;transform:rotate(-90deg)}

  /* ── Tiroir « Parcours » façon panneau natif ── */
  .rail{
    width:min(86vw,340px);border-radius:0 18px 18px 0;
    height:calc(100% - 64px - env(safe-area-inset-bottom));
    padding-bottom:calc(30px + env(safe-area-inset-bottom));
  }

  /* ── Recherche plein écran ── */
  .pal-back{padding:0;align-items:stretch;justify-content:stretch}
  .pal{width:100%;max-width:none;height:100dvh;border-radius:0;border:none;display:flex;flex-direction:column}
  .pal-in{padding-top:calc(12px + env(safe-area-inset-top))}
  .pal-list{max-height:none;flex:1;overflow-y:auto;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  /* Sur tactile, pas de touche Échap : l'indication est remplacée par un
     vrai bouton de fermeture (croix). */
  .pal-esc{display:none}
  .pal-close-mob{
    display:flex;align-items:center;justify-content:center;flex-shrink:0;

  }
  .pal-close-mob:active{background:var(--spale)}
  .pal-close-mob .uicon{width:17px;height:17px;transform:rotate(45deg)}

  /* ── Toast au-dessus de la barre ── */
  .toast{bottom:calc(80px + env(safe-area-inset-bottom))}

  /* ── Écran « Fiches » : panneau bas listant les parties ── */
  .mob-veil{
    display:block;position:fixed;inset:0;z-index:110;background:rgba(38,26,20,.42);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  .mob-veil.show{opacity:1;pointer-events:auto}
  .mob-sheet{

  .msheet-title{font-family:'Playfair Display',serif;font-weight:800;font-size:17px;color:var(--ink);margin:0 4px 12px}

  .rb-btn,.rb-copy,.rb-print{min-width:40px;min-height:40px}
}

<script>
/* Moteur A4 (pagination + document) — repris a l identique de la V1 */
/* Calcule (et met en cache) le ratio mm → px du moteur de rendu */
function _a4MmToPx(){
  if(window._a4PxPerMm)return window._a4PxPerMm;
  const m=document.createElement('div');
  m.style.cssText='position:fixed;left:-99999px;top:0;width:100mm;height:0;visibility:hidden;';
  document.body.appendChild(m);
  const r=m.offsetWidth/100;
  m.remove();
  window._a4PxPerMm=r||3.7795;
  return window._a4PxPerMm;
}

/* Détermine si le numéro est un emoji (intro) ou une référence "F17" */
function _a4IsEmojiNum(n){
  if(!n)return false;
  return /[\u{1F000}-\u{1FFFF}]|[\u{2600}-\u{27BF}]/u.test(n)||(n.length<=2&&!/^F\d/i.test(n));
}

/* Génère le HTML d'en-tête (présent sur chaque page) */
function _a4BuildHeader(d,partLabel){
  return '<header class="a4-header">'+
    '<div class="a4-h-brand">'+
      '<div class="a4-h-emblem"><svg viewBox="8 8 48 48" width="100%" height="100%" role="img" style="display:block;color:#fff"><g opacity=".55"><ellipse cx="32" cy="32" rx="21" ry="9.5" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(-18 32 32)"/><ellipse cx="32" cy="32" rx="21" ry="9.5" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(42 32 32)"/><ellipse cx="32" cy="32" rx="21" ry="9.5" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(102 32 32)"/></g><circle cx="49.5" cy="25" r="2.4" fill="currentColor"/><circle cx="20" cy="46.5" r="2.4" fill="currentColor"/><circle cx="18.5" cy="20.5" r="2.4" fill="currentColor"/><text x="32" y="40" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-size="28" font-weight="700" letter-spacing="-1" fill="#fff">Σ</text></svg></div>'+
      '<div class="a4-h-text">'+
        '<div class="a4-h-title">Kit CTEN — Mathématiques · Physique-Chimie</div>'+
        '<div class="a4-h-sub">'+partLabel+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="a4-h-fiche">'+
      '<span class="a4-h-fiche-label">Fiche</span>'+
      '<span class="a4-h-fiche-id">'+d.n+'</span>'+
    '</div>'+
  '</header>';
}

/* Génère le HTML de pied de page (présent sur chaque page) */
function _a4BuildFooter(pageNum,pageTotal){
  const date=new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  return '<footer class="a4-footer">'+
    '<div class="a4-f-left">Kit CTEN · Application créée par LD &amp; EDJ</div>'+
    '<div class="a4-f-center">π · ⚛</div>'+
    '<div class="a4-f-right">'+
      '<span class="a4-f-date">'+date+'</span>'+
      '<span class="a4-f-page">'+pageNum+' / '+pageTotal+'</span>'+
    '</div>'+
  '</footer>';
}

/* Génère le bloc de titre placé sur la 1ère page uniquement */
function _a4BuildTitleBlock(d,partLabel){
  const isEmoji=_a4IsEmojiNum(d.n);
  return '<div class="a4-title-block">'+
    '<div class="a4-tb-num'+(isEmoji?' emoji':'')+'">'+d.n+'</div>'+
    '<div class="a4-tb-text">'+
      '<h2 class="a4-tb-title">'+d.t+'</h2>'+
      '<p class="a4-tb-sub">'+d.s+'</p>'+
      '<div class="a4-tb-meta">'+partLabel+'</div>'+
    '</div>'+
  '</div>';
}

/* Construit un document A4 complet pour une fiche.
   - Mesure chaque bloc de contenu hors écran
   - Les répartit sur des pages A4 sans couper de section
   - Renvoie {html, pageCount}
*/
function buildA4Document(fid){
  const d=M[fid];
  if(!d)return null;

  const partKey=FICHE_TAB[fid]||'intro';
  const partLabel=PART_LABEL_FULL[partKey]||'Kit CTEN';
  const pxMm=_a4MmToPx();

  // Hauteur utile contenu = 297 - 14 (header) - 12 (footer) - 2*6 (padding interne) = 253mm
  // Buffer minimal de 2mm pour absorber les arrondis du moteur de rendu.
  const usableContentH=(297-14-12-12-2)*pxMm;
  const contentWidth=(210-15-15)*pxMm;

  // ─── Mesure du flux complet ─────────────────────────────────
  // On rend titre + contenu ENSEMBLE dans une boîte invisible de la
  // largeur exacte d'une page A4. Comme les blocs sont voisins, le
  // navigateur applique nativement margin-collapsing, line-height,
  // padding, etc. Puis on lit pour chaque bloc sa position réelle
  // (offsetTop + offsetHeight) — ce qui donne sa fin EXACTE dans
  // le flux, sans aucune estimation à reconstituer.
  const scratch=document.createElement('div');
  scratch.className='a4-content';
  scratch.style.cssText='position:fixed;left:-99999px;top:0;width:'+contentWidth+'px;height:auto;visibility:hidden;padding:0;';
  const titleHTML=_a4BuildTitleBlock(d,partLabel);
  scratch.innerHTML=titleHTML+d.b;
  document.body.appendChild(scratch);

  // Collecte des enfants directs avec leur position de fin réelle
  const items=Array.from(scratch.children).map(function(child){
    return {
      el:child,
      html:child.outerHTML,
      isTitle:child.classList&&child.classList.contains('a4-title-block'),
      top:child.offsetTop,
      bottom:child.offsetTop+child.offsetHeight
    };
  });
  scratch.remove();

  // ─── Répartition sur les pages ──────────────────────────────
  // pageStart = offsetTop du PREMIER bloc de la page courante.
  // Un bloc tient sur la page si (bloc.bottom - pageStart) <= usableContentH.
  // Sinon, on crée une nouvelle page qui DÉMARRE à ce bloc.
  const pages=[];
  let currentHTML='';
  let pageStart=0;
  let hasContent=false;

  items.forEach(function(it,idx){
    const heightFromPageStart=it.bottom-pageStart;
    if(heightFromPageStart>usableContentH&&hasContent){
      // Ce bloc fait déborder la page courante : on clôt la page,
      // on en ouvre une nouvelle qui démarre à ce bloc.
      pages.push(currentHTML);
      currentHTML=it.html;
      pageStart=it.top;
      hasContent=true;
    }else{
      currentHTML+=it.html;
      hasContent=true;
    }
  });
  if(currentHTML)pages.push(currentHTML);

  // ─── Génération du HTML final ───────────────────────────────
  const total=pages.length;
  let html='<div class="a4-viewer">';
  pages.forEach(function(pageHTML,i){
    html+='<article class="a4-page" data-page="'+(i+1)+'">';
    html+=_a4BuildHeader(d,partLabel);
    html+='<div class="a4-content">'+pageHTML+'</div>';
    html+=_a4BuildFooter(i+1,total);
    html+='</article>';
  });
  html+='</div>';

  return {html:html,pageCount:total};
}

/* Construit une version « lecture continue » d'une fiche, pour l'affichage
   MOBILE uniquement. Contrairement à buildA4Document, on NE découpe PAS le
   contenu en pages A4 de hauteur fixe (ce qui, sur petit écran, coupe le bas
   des sections). On rend toute la fiche dans une seule colonne qui grandit
   avec son contenu : un en-tête, le titre, l'intégralité du corps, un pied.
   Le CSS .a4-flow (mobile) libère la hauteur pour que rien ne soit tronqué.
   Le rendu bureau et l'impression continuent d'utiliser buildA4Document. */
function buildA4Flow(fid){
  var d=M[fid];
  if(!d)return null;
  var partKey=FICHE_TAB[fid]||'intro';
  var partLabel=PART_LABEL_FULL[partKey]||'Kit CTEN';
  // Pied de page épuré pour le mobile : sans mention du kit ni numéro de
  // page (le « 1 / 1 » n'a pas de sens en lecture continue). Le rendu bureau et
  // l'impression gardent le pied complet via _a4BuildFooter (aucune régression).
  var date=new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  var footer='<footer class="a4-footer a4-footer-flow">'+
      '<div class="a4-f-left">Application créée par LD &amp; EDJ</div>'+
      '<div class="a4-f-center">π · ⚛</div>'+
      '<div class="a4-f-right"><span class="a4-f-date">'+date+'</span></div>'+
    '</footer>';
  var html='<div class="a4-viewer a4-flow">'+
    '<article class="a4-page" data-page="1">'+
      _a4BuildHeader(d,partLabel)+
      '<div class="a4-content">'+_a4BuildTitleBlock(d,partLabel)+d.b+'</div>'+
      footer+
    '</article>'+
  '</div>';
  return {html:html,pageCount:1};
}

/* ═══════════════════════════════════════════════════════════════
   KIT CTEN — V2 « Classeur » · logique applicative
   Dépend de : window.FICHES (KitCTEN-fiches.js) + moteur A4 (ci-dessus)
   ═══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

/* ── Données fiches ── */

function profileById(id){ for(var i=0;i<PROFILES.length;i++) if(PROFILES[i].id===id) return PROFILES[i]; return null; }
// profil suivant dans la progression (ordre du tableau PROFILES)
function nextProfile(id){
  for(var i=0;i<PROFILES.length;i++) if(PROFILES[i].id===id) return (i < PROFILES.length-1) ? PROFILES[i+1] : null;
  return null;
}

/* ── État + persistance ── */
var KEY='kitcten-v2';
var store = (function(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } })();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
store.read = store.read || {};
store.fav = store.fav || {};                       // fiches épinglées (favoris)
if(typeof store.uz!=='number') store.uz = 1;      // zoom utilisateur

var state = { mode:'cover', section:'intro', fiche:null };

/* ── Utilitaires ── */
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function icon(id, cls){ return '<svg class="uicon '+(cls||'')+'" aria-hidden="true"><use href="#'+id+'"/></svg>'; }
function cssv(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function isRead(id){ return !!store.read[id]; }
function markRead(id){ if(!store.read[id]){ store.read[id]=1; save(); } }
function isFav(id){ return !!store.fav[id]; }
function toggleFav(id){ if(store.fav[id]){ delete store.fav[id]; } else { store.fav[id]=1; } save(); return !!store.fav[id]; }
function favCount(){ return Object.keys(store.fav).filter(function(id){ return M[id]; }).length; }

function renderTabs(){
  var cur = state.section;
  var html='';
  SECTIONS.forEach(function(s){
    var on = (s.id===cur) ? ' on' : '';
    var count = (s.id!=='intro' && s.id===cur) ? ('<span class="tab-count">'+s.fiches.length+'</span>') : '';
    html += '<button class="tab'+on+'" data-tab="'+s.id+'" '+
            'style="--sec:var('+s.color+')" '+
            'title="'+esc(s.label)+'" aria-label="'+esc(s.label)+'">'+
            count+'<span class="tab-label">'+esc(s.label)+'</span></button>';
  });
  $tabs.innerHTML = html;
}

function renderRail(){
  var prof = profileById(store.profile);

  // Aucun profil : choisir sa situation directement ici (point d'entrée naturel)
  if(!prof){
    var opts='';
    PROFILES.forEach(function(p){
      opts+='<button class="rail-rm-opt" data-profile="'+p.id+'">'+
        '<span class="rail-rm-opt-label">'+esc(p.label)+'</span>'+
        '<span class="rail-rm-opt-tag">'+esc(p.tagline)+'</span></button>';
    });
    $rail.innerHTML =
      '<div class="rail-rm-empty">'+
        '<div class="rail-rm-eyebrow">Ma feuille de route</div>'+
        '<p class="rail-rm-hint">Quelle est votre situation&nbsp;? Le kit vous proposera un parcours de fiches à suivre.</p>'+
        '<div class="rail-rm-opts">'+opts+'</div>'+
      '</div>';
    return;
  }

  // Feuille de route = parcours conseillé du profil
  var rmValid = prof.fiches.filter(function(id){ return M[id]; });
  var rmTot = rmValid.length;
  var rmRead = rmValid.filter(function(id){ return isRead(id); }).length;
  var rmDone = rmTot > 0 && rmRead === rmTot;
  var rmPct = rmTot ? Math.round(rmRead / rmTot * 100) : 0;
  var rmNext = rmDone ? nextProfile(prof.id) : null;
  var h='<div class="rail-rm-head">'+
          '<div class="rail-rm-htxt">'+
            '<span class="rail-rm-eyebrow">Ma feuille de route</span>'+
            '<span class="rail-rm-name">'+esc(prof.label)+'</span>'+
          '</div>'+
          '<button class="rail-rm-change" data-profile-reset title="Changer de situation">Changer</button>'+
        '</div>'+
        '<div class="rail-rm-prog'+(rmDone?' done':'')+'">'+
          '<div class="rail-rm-progbar"><span style="width:'+rmPct+'%"></span></div>'+
          '<span class="rail-rm-progtxt">'+(rmDone ? 'Parcours terminé' : (rmRead+' / '+rmTot+' fiches lues'))+'</span>'+
        '</div>'+
        (rmNext ?
          '<button class="rail-rm-next" data-profile="'+rmNext.id+'">'+
            '<span class="rail-rm-next-eyebrow">La suite naturelle</span>'+
            '<span class="rail-rm-next-row"><span class="rail-rm-next-label">'+esc(rmNext.label)+'</span>'+icon('i-arrow-right','rail-rm-next-go')+'</span>'+
          '</button>' : '')+
        '<div class="rail-rm-list">';
  prof.fiches.forEach(function(id, i){
    var d=M[id]; if(!d) return;
    var on   = (state.mode==='fiche' && state.fiche===id) ? ' on' : '';
    var done = isRead(id) ? ' done' : '';
    h+='<button class="rail-rm-item'+on+done+'" data-fiche="'+id+'">'+
         '<span class="rail-rm-code">'+esc(d.n)+'</span>'+
         '<span class="rail-rm-t">'+esc(d.t)+'</span>'+
         icon('i-check','rail-rm-check')+'</button>';
  });
  h+='</div>';
  h+='<button class="rail-rm-print" data-print-parcours title="Imprimer toutes les fiches du parcours">'+icon('i-printer')+'<span>Imprimer le parcours</span></button>';
  $rail.innerHTML = h;

  var onEl = $rail.querySelector('.rail-rm-item.on');
  if(onEl && onEl.scrollIntoView) onEl.scrollIntoView({block:'nearest'});
}

  }

/* ── Marquage « lu » fiable ──
   Une fiche n'est comptée comme lue que si elle a été réellement parcourue :
   soit défilée jusqu'au bas du contenu (fiches longues),
   soit restée affichée un certain temps (fiches courtes, sans défilement). */
var READ_DELAY = 8000;   // ms de présence avant de considérer la fiche lue
var _readTimer = null, _readScrollFn = null, _readScrollEl = null;

function disarmRead(){
  if(_readTimer){ clearTimeout(_readTimer); _readTimer=null; }
  if(_readScrollEl && _readScrollFn){ _readScrollEl.removeEventListener('scroll', _readScrollFn); }
  _readScrollEl=null; _readScrollFn=null;
}

function armRead(id, sc){
  disarmRead();
  if(isRead(id)) return;

  function done(){
    disarmRead(); markRead(id); renderRail();
    // le parcours vient-il de s'achever ?
    var prof = profileById(store.profile);
    if(prof){
      var pv = prof.fiches.filter(function(f){ return M[f]; });
      if(pv.indexOf(id) >= 0 && pv.every(function(f){ return isRead(f); })){
        toast('Parcours terminé — bravo !', 'i-check', true);
        return;
      }
    }
    toast('Fiche lue', 'i-check');
  }

  // 1) fiche parcourue jusqu'au bas → lue
  if(sc){
    _readScrollEl = sc;
    _readScrollFn = function(){
      if(state.fiche !== id) { disarmRead(); return; }

/* ── Zoom : ajustement largeur × facteur utilisateur ── */

  var pageW = _a4MmToPx()*210;

function currentZoom(){
  var z = fitBase()*store.uz;

  // de l'écran, sinon la page (794 px) déborde et les bords gauche/droite sont
  // rognés (mots coupés). On retire donc le plancher de 40 % dans ce mode.

function navTrack(id){
  var prof = profileById(store.profile);

    var list = prof.fiches.filter(function(f){ return M[f]; });
    if(list.indexOf(id) >= 0) return { list:list, inParcours:true };

function flip(dir){
  if(state.mode!=='fiche'){

    var s=secById(state.section);

  var tr=navTrack(state.fiche);
  var idx=tr.list.indexOf(state.fiche);
  var next = dir==='next' ? idx+1 : idx-1;
  if(next<0 || next>=tr.list.length) return;
  openFiche(tr.list[next], dir);

// extrait de contexte autour du terme trouvé dans le corps
function palSnippet(raw, q){

var A4_PRINT_CSS =

function cssText(id){ var el=document.getElementById(id); return el ? el.textContent : ''; }

// Impression isolée d'un contenu A4 (une fiche ou un livret de fiches)
function buildPrintDoc(innerHTML, title){
  var frame = document.createElement('iframe');
  frame.setAttribute('aria-hidden','true');
  frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
  document.body.appendChild(frame);

  var doc = frame.contentDocument || frame.contentWindow.document;
  doc.open();
  doc.write(
    '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">' +
    '<title>' + esc(title || 'Kit CTEN') + '</title>' +
    '<style>' + cssText('v2-fonts') + '</style>' +
    '<style>' + cssText('shell')    + '</style>' +
    '<style>' + cssText('a4-css')   + '</style>' +
    '<style>' + A4_PRINT_CSS + '</style>' +
    '</head><body>' + innerHTML + '</body></html>'
  );
  doc.close();

  var done = false;
  function cleanup(){ if(done) return; done=true; setTimeout(function(){ if(frame.parentNode) frame.parentNode.removeChild(frame); }, 300); }
  function go(){
    try{
      frame.contentWindow.focus();
      frame.contentWindow.onafterprint = cleanup;
      frame.contentWindow.print();
    }catch(err){ window.print(); }
    setTimeout(cleanup, 60000);
  }
  if(frame.contentDocument && frame.contentDocument.fonts && frame.contentDocument.fonts.ready){
    frame.contentDocument.fonts.ready.then(function(){ setTimeout(go, 80); });
  } else {
    setTimeout(go, 300);
  }
}

/* Copie le lien direct de la fiche affichée (deep-link #id) dans le presse-papiers. */
function copyFicheLink(id){
  if(!id) return;
  var url=location.origin+location.pathname+location.search+'#'+id;
  var ok=function(){ toast('Lien copié'); };
  var fallback=function(){
    try{
      var ta=document.createElement('textarea');
      ta.value=url; ta.style.cssText='position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var done=document.execCommand('copy'); ta.remove();
      done ? ok() : toast('Copie impossible');
    }catch(e){ toast('Copie impossible'); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(ok, fallback);
  }else{ fallback(); }
}

    if(np){
      var cnt = np.fiches.filter(function(f){ return M[f]; }).length;
      toast('Feuille de route prête : ' + cnt + ' fiches', 'i-book');
    }
  }
  else if(t.dataset.tab!=null){ openDivider(t.dataset.tab); }
  else if(t.dataset.sec!=null){ openDivider(t.dataset.sec); }
  else if(t.dataset.fiche!=null){ openFiche(t.dataset.fiche); }
  else if(t.dataset.nav!=null){ flip(t.dataset.nav); }
  else if(t.dataset.zoom!=null){ bumpZoom(parseInt(t.dataset.zoom,10)); }
  else if(t.hasAttribute('data-print')){ printFiche(); }
  else if(t.hasAttribute('data-copy')){ copyFicheLink(state.fiche); }
  else if(t.dataset.pal!=null){ palClose(); openFiche(t.dataset.pal); }
}

function onKey(e){
  if($palBack.classList.contains('open')){
    if(e.key==='Escape'){ palClose(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); palMove(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); palMove(-1); }
    else if(e.key==='Enter'){ e.preventDefault(); palChoose(); }
    return;
  }
  var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if((e.key==='k'||e.key==='K') && (e.metaKey||e.ctrlKey)){ e.preventDefault(); palOpen(); return; }
  if(e.key==='/' && !typing){ e.preventDefault(); palOpen(); return; }
  if(typing) return;
  if(e.key==='ArrowRight'){ flip('next'); }
  else if(e.key==='ArrowLeft'){ flip('prev'); }
  else if(e.key==='Escape'){
    if($rail && $rail.classList.contains('open')){ closeRailMobile(); return; }
    if(state.mode==='fiche'){ var es=secById(state.section); if(es.fiches.length>1) openDivider(state.section); else openCover(); }
    else if(state.mode==='divider') openCover();
  }
}

var rzT;
function onResize(){ clearTimeout(rzT); rzT=setTimeout(function(){
  if(state.mode!=='fiche') return;
  // Si on franchit le seuil mobile/ordinateur (rotation, redimensionnement),
  // on rebascule entre lecture continue et pages A4 ; sinon simple recalage du zoom.
  if(_lastFlow!==null && isFicheFlow()!==_lastFlow) renderFiche();
  else applyZoom();
},120); }

/* ═══ INIT ═══ */
function init(){
  $reader = document.querySelector('.reader');
  $rail = document.querySelector('.rail');
  $tabs = document.querySelector('.tabs');
  $palBack = document.querySelector('.pal-back');
  $palInput = document.getElementById('pal-input');
  $palList = document.querySelector('.pal-list');
  $palFilters = document.querySelector('.pal-filters');
  $toast = document.querySelector('.toast');
  $railToggle = document.querySelector('.rail-toggle');
  $railVeil   = document.querySelector('.rail-veil');

  document.addEventListener('click', onClick);
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', onResize);
  window.addEventListener('hashchange', onHashChange);
  $palInput.addEventListener('input', function(){ palRender($palInput.value); });
  $palBack.addEventListener('click', function(e){ if(e.target===$palBack) palClose(); });
  if($palFilters) $palFilters.addEventListener('click', function(e){
    var b=e.target.closest('[data-plevel],[data-ptheme],[data-preset],[data-pfav]'); if(!b) return;
    if(b.hasAttribute('data-preset')){ palLevel='all'; palTheme=null; palFav=false; }
    else if(b.hasAttribute('data-pfav')){ palFav=!palFav; }
    else if(b.dataset.plevel!=null){ palLevel=b.dataset.plevel; }
    else if(b.dataset.ptheme!=null){ palTheme=(palTheme===b.dataset.ptheme?null:b.dataset.ptheme); }
    palRenderFilters(); palRender($palInput.value);
  });
  var searchBtn=document.querySelector('.tb-search'); if(searchBtn) searchBtn.addEventListener('click', palOpen);
  var homeBtn=document.querySelector('.tb-home'); if(homeBtn) homeBtn.addEventListener('click', openCover);
  if($railToggle) $railToggle.addEventListener('click', railToggleOpen);
  if($railVeil) $railVeil.addEventListener('click', closeRailMobile);

  // priorité au hash de l'URL (lien partagé #f14, #p2, #intro), sinon reprise de la dernière position
  var resumed = applyHash();
  if(!resumed && store.mode==='fiche' && store.last && M[store.last]){ openFiche(store.last); resumed=true; }
  else if(!resumed && store.mode==='divider' && store.sec){ openDivider(store.sec); resumed=true; }
  if(!resumed) openCover();

  // ── Re-pagination après chargement des polices ──
  // Le découpage A4 (buildA4Document) mesure la hauteur du texte au moment du
  // rendu. Si Playfair/Nunito ne sont pas encore prêtes, le texte est mesuré
  // avec une police de secours plus compacte : le moteur croit que tout tient
  // sur une seule page, puis la vraie police déborde et le bas de la fiche est
  // coupé (recouvert par le pied de page). Très visible sur mobile, où les
  // polices arrivent plus tard. On refait donc le rendu de la fiche affichée
  // dès que les polices sont réellement disponibles, pour recalculer les pages.
  // On ne relance le rendu que si le découpage a réellement changé (nombre de
  // pages différent), pour ne pas réinitialiser le défilement sans raison. Le
  // contrôle est donc idempotent : une fois la pagination correcte, il n'agit plus.
  function repaginateOnFonts(){
    if(state.mode!=='fiche' || !state.fiche || isFicheFlow()) return; // le flux mobile n'a pas de découpage à corriger
    var viewer = $reader.querySelector('.a4-viewer');
    var curPages = viewer ? viewer.querySelectorAll('.a4-page').length : 0;
    var res = (typeof buildA4Document==='function') ? buildA4Document(state.fiche) : null;
    if(res && res.pageCount !== curPages) renderFiche();
  }
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(repaginateOnFonts);
    // filet de sécurité : certains navigateurs résolvent fonts.ready très tôt
    window.addEventListener('load', function(){ setTimeout(repaginateOnFonts, 60); });
  } else {
    window.addEventListener('load', repaginateOnFonts);
  }
}

/* ═══ MOTEUR MOBILE DÉDIÉ ═══
   Couche additive, active uniquement ≤760px : barre de navigation basse type
   appli native, écran « Fiches » (panneau des parties), gestes de balayage
   pour feuilleter. Chaque point d'entrée vérifie mobActive() : aucun impact
   sur le comportement ordinateur. */
var $mnav=null, $mobSheet=null, $mobVeil=null;
function mobActive(){ return window.matchMedia('(max-width:760px)').matches; }

function mobBuild(){
  if($mnav) return;
  $mobVeil=document.createElement('div'); $mobVeil.className='mob-veil';
  $mobSheet=document.createElement('div'); $mobSheet.className='mob-sheet';
  $mobSheet.setAttribute('role','dialog'); $mobSheet.setAttribute('aria-label','Parcourir le classeur');
  $mnav=document.createElement('nav'); $mnav.className='mnav'; $mnav.setAttribute('aria-label','Navigation principale');
  $mnav.innerHTML=
    '<button class="mnav-btn" data-mnav="home" aria-label="Accueil">'+icon('i-mob-home')+'<span>Accueil</span></button>'+
    '<button class="mnav-btn" data-mnav="parts" aria-label="Les fiches par partie">'+icon('i-mob-grid')+'<span>Fiches</span></button>'+
    '<button class="mnav-btn" data-mnav="path" aria-label="Ma feuille de route">'+icon('i-mob-route')+'<span>Parcours</span></button>'+
    '<button class="mnav-btn" data-mnav="search" aria-label="Rechercher">'+icon('i-search')+'<span>Rechercher</span></button>';
  document.body.appendChild($mobVeil);
  document.body.appendChild($mobSheet);
  document.body.appendChild($mnav);
  $mnav.addEventListener('click', function(e){
    var b=e.target.closest('[data-mnav]'); if(!b) return;
    var k=b.dataset.mnav;
    var palIsOpen=$palBack && $palBack.classList.contains('open');
    if(k==='home'){ mobSheetClose(); closeRailMobile(); if(palIsOpen) palClose(); openCover(); }
    else if(k==='parts'){ if(palIsOpen) palClose(); closeRailMobile(); mobSheetToggle(); }
    else if(k==='path'){ if(palIsOpen) palClose(); mobSheetClose(); railToggleOpen(); }
    else if(k==='search'){ mobSheetClose(); closeRailMobile(); if(palIsOpen) palClose(); else palOpen(); }
    mobNavState();
  });
  $mobVeil.addEventListener('click', mobSheetClose);
}

function mobSheetRender(){
  if(!$mobSheet) return;
  var h='<div class="msheet-grip"></div><div class="msheet-title">Parcourir le classeur</div>';
  SECTIONS.forEach(function(s){
    var tot=s.fiches.length;
    var read=s.fiches.filter(function(id){ return isRead(id); }).length;
    var meta=s.id==='intro' ? 'Introduction' : ('Partie '+s.mark+' · '+tot+' fiches'+(read?(' · '+read+' lues'):''));
    h+='<button class="msec" data-sec="'+s.id+'" style="--sec:var('+s.color+')">'+
      '<span class="msec-badge">'+(s.id==='intro'?icon('i-book'):esc(s.mark))+'</span>'+
      '<span class="msec-txt"><span class="msec-name">'+esc(s.label)+'</span>'+
      '<span class="msec-meta">'+esc(meta)+'</span></span>'+
      icon('i-chevron-right','msec-go')+'</button>';
  });
  $mobSheet.innerHTML=h;
}
function mobSheetOpen(){ if(!mobActive() || !$mobSheet) return; mobSheetRender(); $mobSheet.classList.add('open'); $mobVeil.classList.add('show'); mobNavState(); }
function mobSheetClose(){ if(!$mobSheet) return; $mobSheet.classList.remove('open'); $mobVeil.classList.remove('show'); mobNavState(); }
function mobSheetToggle(){ if($mobSheet && $mobSheet.classList.contains('open')) mobSheetClose(); else mobSheetOpen(); }

function mobNavState(){
  if(!$mnav) return;
  var sheetOpen=$mobSheet && $mobSheet.classList.contains('open');
  var railIsOpen=$rail && $rail.classList.contains('open');
  var palIsOpen=$palBack && $palBack.classList.contains('open');
  var map={
    home: !sheetOpen && !railIsOpen && !palIsOpen && state.mode==='cover',
    parts: sheetOpen || (!railIsOpen && !palIsOpen && (state.mode==='divider'||state.mode==='fiche')),
    path: !!railIsOpen,
    search: !!palIsOpen
  };
  Array.prototype.forEach.call($mnav.querySelectorAll('[data-mnav]'), function(b){
    b.classList.toggle('on', !!map[b.dataset.mnav]);
  });
}

/* Toute navigation passe par updateChrome : on s'y greffe pour synchroniser
   la barre basse et refermer le panneau « Fiches ». Les fonctions d'origine
   sont conservées telles quelles (aucune modification de leur code). */
var _mobUC=updateChrome;
updateChrome=function(){ _mobUC(); mobSheetClose(); mobNavState(); };
var _mobPalOpen=palOpen, _mobPalClose=palClose;
palOpen=function(){ _mobPalOpen(); mobNavState(); };
palClose=function(){ _mobPalClose(); mobNavState(); };
var _mobRailOpen=railOpen, _mobRailClose=closeRailMobile;
railOpen=function(){ _mobRailOpen(); mobNavState(); };
closeRailMobile=function(){ _mobRailClose(); mobNavState(); };

/* Balayage horizontal : fiche suivante / précédente (lecture mobile). */
var _swX=0,_swY=0,_swT=0,_swOk=false;
document.addEventListener('touchstart', function(e){
  _swOk=false;
  if(!mobActive() || state.mode!=='fiche' || e.touches.length!==1) return;
  if(!e.target.closest || !e.target.closest('.reader')) return;
  if(e.target.closest('.tbl')) return;
  _swX=e.touches[0].clientX; _swY=e.touches[0].clientY; _swT=Date.now(); _swOk=true;
},{passive:true});
document.addEventListener('touchend', function(e){
  if(!_swOk) return; _swOk=false;
  var t=e.changedTouches[0];
  var dx=t.clientX-_swX, dy=t.clientY-_swY, dt=Date.now()-_swT;
  if(dt>600 || Math.abs(dx)<70 || Math.abs(dx)<2.2*Math.abs(dy)) return;
  flip(dx<0?'next':'prev');
},{passive:true});

/* Échap referme le panneau « Fiches » en priorité (phase de capture). */
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && $mobSheet && $mobSheet.classList.contains('open')){
    e.stopPropagation(); mobSheetClose();
  }
}, true);

/* Retour au-dessus du seuil (rotation, redimensionnement) : on referme les
   surfaces mobiles ; la barre elle-même est masquée par le CSS. */
window.addEventListener('resize', function(){ if(!mobActive()) mobSheetClose(); });

/* Accueil : sur tactile, l'astuce clavier (« / », flèches) n'a pas de sens.
   On garde la 1re ligne (attribution) et on remplace le conseil. */
var _mobRenderCover=renderCover;
renderCover=function(){
  _mobRenderCover();
  if(!mobActive() || !$reader) return;
  var f=$reader.querySelector('.cover-foot');
  if(!f) return;
  var parts=f.innerHTML.split('<br>');
  f.innerHTML=parts[0]+'<br>Astuce : <strong>balayez</strong> une fiche vers la gauche ou la droite pour feuilleter.';
};
var _mobWasActive=mobActive();
window.addEventListener('resize', function(){
  if(mobActive()!==_mobWasActive){
    _mobWasActive=mobActive();
    if(state.mode==='cover') renderCover();
  }
});

/* Bouton « retour en haut » : apparaît après un long défilement dans une fiche. */
var $mobTop=document.createElement('button');
$mobTop.className='mob-top';
$mobTop.setAttribute('aria-label','Revenir en haut de la fiche');
$mobTop.innerHTML=icon('i-arrow-right');
$mobTop.addEventListener('click', function(){
  var sc=$reader && $reader.querySelector('.reader-scroll');
  if(sc){ if(sc.scrollTo) sc.scrollTo({top:0,behavior:'smooth'}); else sc.scrollTop=0; }
  $mobTop.classList.remove('show');
});
document.body.appendChild($mobTop);
document.addEventListener('scroll', function(e){
  if(!mobActive() || state.mode!=='fiche'){ $mobTop.classList.remove('show'); return; }
  var sc=e.target;
  if(!sc || !sc.classList || !sc.classList.contains('reader-scroll')) return;
  $mobTop.classList.toggle('show', sc.scrollTop>600);
}, true);
var _mobUC2=updateChrome;
updateChrome=function(){ _mobUC2(); $mobTop.classList.remove('show'); };

/* Recherche : bouton de fermeture tactile (la palette couvre tout l'écran
   sur mobile et Échap n'existe pas au doigt). Masqué au-dessus de 760px. */
(function(){
  var palIn=document.querySelector('.pal-in');
  if(!palIn) return;
  var b=document.createElement('button');
  b.className='pal-close-mob';
  b.setAttribute('aria-label','Fermer la recherche');
  b.innerHTML=icon('i-plus');
  b.addEventListener('click', function(){ palClose(); });
  palIn.appendChild(b);
})();

mobBuild();

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();

</script>
</body>
</html>
